services:
  prometheus:
    image: prom/prometheus:v3.5.3
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prom_data:/prometheus
    networks:
      - observability

  alertmanager:
    image: prom/alertmanager:v0.29.0
    container_name: alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    restart: unless-stopped
    volumes:
      - ./alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    networks:
      - observability

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - observability

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
    ports:
      - "3100:3100"
    restart: unless-stopped
    volumes:
      - ./loki:/etc/loki
      - loki_data:/loki
    networks:
      - observability

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:5.0.7
    container_name: fluent-bit
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - "24224:24224"
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    networks:
      - observability

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0
    container_name: jaeger
    ports:
      - "16686:16686"
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector:0.154.0
    container_name: otel-collector
    command:
      - "--config=/etc/otelcol/config.yaml"
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    depends_on:
      - jaeger
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - observability

  grafana:
    image: grafana/grafana-enterprise:12.2.9
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    networks:
      - observability

volumes:
  prom_data:
  alertmanager_data:
  loki_data:
  grafana_data:

networks:
  observability:
    name: observability_lab
