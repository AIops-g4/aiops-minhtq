global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "demo-app"
    scrape_interval: 5s
    static_configs:
      - targets: ["demo-app:8000"]

  - job_name: "inventory-service"
    scrape_interval: 5s
    static_configs:
      - targets: ["inventory-service:8000"]
